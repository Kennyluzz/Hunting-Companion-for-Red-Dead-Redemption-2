[General]
; Menu key (Windows virtual-key code, 119 = F8). Also changeable in the in-game Settings page.
MenuKey=119
; -1 = follow the game's language.
UILanguage=-1
; Key that toggles the "craftable now" filter (219 = [ ).
FilterKey=219
; Key that shows / hides the weapon and ammo icons (221 = ] ).
WeaponIconsKey=221
; 1 = show the weapon and ammo icons, 0 = hide them.
ShowWeaponIcons=1
; Menu font, 0-4: Catalogue, Body, Body 1, Title, Ledger.
MenuFont=0

[Overlay]
; Only used to show Japanese, Korean or Chinese when the game itself runs in another language.
; Text size in percent (40-300).
CjkTextScalePercent=100
; Vertical nudge in thousandths of the screen height (-100..100). Positive = down.
CjkTextYOffsetPermille=0
; HDR only: brightness of white overlay text in nits (80-1000).
CjkHdrPaperWhiteNits=230
; Renderer: 0 = automatic, 1 = Vulkan only, 2 = DirectX 12 only (experimental).
OverlayBackend=0
; 1 = write HuntingCompanion.overlay.log next to the game (for bug reports only).
OverlayLog=0
