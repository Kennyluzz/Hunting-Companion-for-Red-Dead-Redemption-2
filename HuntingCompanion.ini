[General]
; Menu key (Windows virtual-key code, 119 = F8). Also changeable in the in-game Settings page.
MenuKey=119
; -1 = follow the game's language.
UILanguage=-1
; Key that toggles the "craftable now" filter (219 = [ ).
FilterKey=219
; Key that shows / hides the weapon and ammo icons (221 = ] ).
WeaponIconsKey=221
; 1 = show the weapon and ammo icons, 0 = hide them.
ShowWeaponIcons=1
; Legendary animals (any weapon gives a perfect pelt) show "Any weapon".
; 1 = with the game's bounty-hunter icon, 0 = text only.
LegendaryIcon=1
; Menu font. Each language has its own list of the game's fonts (shown in Settings) and
; remembers its own choice as MenuFont.<language>=<font>, for example MenuFont.ja-JP=$title1.
; MenuFont=0-4 (Catalogue, Body, Body 1, Title, Ledger) is the default for languages
; without their own choice.
MenuFont=0
; Colours (also in Settings): 0 Default, 1 White, 2 Cream, 3 Gold, 4 Red, 5 Orange,
; 6 Green, 7 Blue, 8 Purple, 9 Grey. TextColour is the menu's text, HeadingColour its
; titles and headings, HudLabelColour the names under the weapon and ammo icons.
TextColour=0
HeadingColour=0
HudLabelColour=0
; Catalogue scan work per game frame in microseconds (0-8000). 0 = one game query
; per frame (slowest). Lower it if you notice stutter right after loading a save or
; opening the menu.
ScanSliceMicroseconds=1000

[HUD]
; Where the HUD icons sit and how large they are. Easiest to set in Settings > HUD layout.
; X and Y move a group in thousandths of the screen (X: negative = left, Y: negative = up);
; Size is in percent (50-250). "All" moves and sizes every icon; "Weapon" the weapon and
; ammo icons; "Vendor" the Pearson and Trapper icons.
AllX=0
AllY=0
AllSize=100
WeaponX=0
WeaponY=0
WeaponSize=100
VendorX=0
VendorY=0
VendorSize=100

[Fonts]
; A companion language the game's own fonts cannot show (Japanese, Korean or Chinese on
; a game in another language, or Latin/Cyrillic letters such as Polish or Spanish accents
; on a Japanese, Korean or Chinese game) is drawn with the game's own font for it, loaded
; from the game files when you pick the language.
; 1 = write HuntingCompanion.fonts.log next to the game (for bug reports only).
FontLog=0
; Optional: the font to use if the automatic choice is wrong (a family name from the
; game's fontmap.xml). Add <Language>Bold=1 if that font is a bold one.
;JapaneseFace=
;KoreanFace=
;ChineseTraditionalFace=
;ChineseSimplifiedFace=
;LatinFace=
;CyrillicFace=
